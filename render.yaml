services:
  - type: web
    name: control-equipos
    runtime: node
    plan: free
    buildCommand: cd backend && pnpm install --prod && cd ../frontend && pnpm install && pnpm run build
    startCommand: cd backend && pnpm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3000"
      - key: STATIC_PATH
        value: /opt/render/project/src/frontend/dist
      - key: DATABASE_URL
        fromDatabase:
          name: control-equipos-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: NODE_OPTIONS
        value: "--max-old-space-size=384"

databases:
  - name: control-equipos-db
    plan: free
    databaseName: control_equipos
    user: control_equipos_user
